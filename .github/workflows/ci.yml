name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Deterministic gate. These must pass for the build to be green.
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Live model evals. Informational only: they run the real analyze() path against
  # a deployed instance, so results move with model non-determinism. A single flaky
  # run should not block a merge, so this job never fails the build. Read it for
  # drift, not as a gate.
  llm-evals:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run LLM evals against deployed agent
        continue-on-error: true
        run: npm run eval
        env:
          EVAL_BASE_URL: ${{ vars.EVAL_BASE_URL }}
          EVAL_THRESHOLD: 80
